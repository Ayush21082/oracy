<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Oracy — Remote Config</title>
  <link rel="icon" href="/app-logo.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="admin">
    <section id="loginView" class="login-box">
      <div class="brand-lock">
        <img src="/app-logo.jpg" alt="" width="40" height="40" />
        <strong style="font-family:Fraunces,Georgia,serif;font-size:1.35rem;">Oracy Admin</strong>
      </div>
      <h1>Remote config</h1>
      <p class="sub">Password-protected. Changes apply to the live app after the next config refresh.</p>
      <label class="field" for="password">Admin password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="primary" id="loginBtn" type="button" style="width:100%">Sign in</button>
      <p class="err hidden" id="loginErr"></p>
    </section>

    <section id="dashView" class="hidden">
      <nav class="admin-nav" aria-label="Admin">
        <a href="/admin" aria-current="page">Remote config</a>
        <a href="/admin/invites">Invites</a>
      </nav>

      <div class="toolbar">
        <div>
          <h1>Remote config</h1>
          <p class="sub" style="margin:0">Supabase feature flags</p>
        </div>
        <div style="display:flex;gap:1rem;align-items:center;">
          <button class="ghost" id="refreshBtn" type="button">Refresh</button>
          <button class="ghost" id="logoutBtn" type="button">Log out</button>
        </div>
      </div>
      <p class="err hidden" id="dashErr"></p>
      <p class="ok hidden" id="dashOk"></p>
      <div id="list"></div>
    </section>
  </main>

  <script>
    const TOKEN_KEY = 'oracy.admin.token'
    const listEl = document.getElementById('list')
    const loginView = document.getElementById('loginView')
    const dashView = document.getElementById('dashView')
    const loginErr = document.getElementById('loginErr')
    const dashErr = document.getElementById('dashErr')
    const dashOk = document.getElementById('dashOk')

    function token() { return sessionStorage.getItem(TOKEN_KEY) || '' }
    function setToken(t) {
      if (t) sessionStorage.setItem(TOKEN_KEY, t)
      else sessionStorage.removeItem(TOKEN_KEY)
    }

    function showLogin() {
      loginView.classList.remove('hidden')
      dashView.classList.add('hidden')
    }
    function showDash() {
      loginView.classList.add('hidden')
      dashView.classList.remove('hidden')
    }

    async function api(action, { method = 'GET', body, auth = true } = {}) {
      const headers = { 'Content-Type': 'application/json' }
      if (auth) headers.Authorization = `Bearer ${token()}`
      const res = await fetch(`/api/remote-config?action=${encodeURIComponent(action)}`, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok) {
        const err = new Error(data.error || res.statusText)
        err.status = res.status
        throw err
      }
      return data
    }

    function formatTime(iso) {
      if (!iso) return ''
      try { return new Date(iso).toLocaleString() } catch { return iso }
    }

    function boolValue(v) {
      if (typeof v === 'boolean') return v
      if (v && typeof v === 'object' && 'value' in v) return Boolean(v.value)
      return Boolean(v)
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
    }

    function renderRows(rows) {
      listEl.innerHTML = ''
      for (const row of rows) {
        const on = boolValue(row.value)
        const card = document.createElement('div')
        card.className = 'card'
        card.innerHTML = `
          <div class="row-top">
            <div>
              <div class="key">${escapeHtml(row.key)}</div>
              <p class="desc">${escapeHtml(row.description || '')}</p>
              <div class="meta">Updated ${escapeHtml(formatTime(row.updated_at))}</div>
            </div>
            <label class="switch" title="Toggle">
              <input type="checkbox" ${on ? 'checked' : ''} data-key="${escapeHtml(row.key)}" />
              <span class="slider"></span>
            </label>
          </div>`
        const input = card.querySelector('input')
        input.addEventListener('change', async () => {
          input.disabled = true
          dashErr.classList.add('hidden')
          dashOk.classList.add('hidden')
          try {
            const updated = await api('update', {
              method: 'PATCH',
              body: { key: row.key, value: input.checked }
            })
            row.value = updated.row.value
            row.updated_at = updated.row.updated_at
            card.querySelector('.meta').textContent = `Updated ${formatTime(row.updated_at)}`
            dashOk.textContent = `Saved ${row.key}`
            dashOk.classList.remove('hidden')
          } catch (e) {
            input.checked = !input.checked
            if (e.status === 401) {
              setToken('')
              showLogin()
            }
            dashErr.textContent = e.message || 'Save failed'
            dashErr.classList.remove('hidden')
          } finally {
            input.disabled = false
          }
        })
        listEl.appendChild(card)
      }
    }

    async function load() {
      dashErr.classList.add('hidden')
      const data = await api('list')
      renderRows(data.rows || [])
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      loginErr.classList.add('hidden')
      const password = document.getElementById('password').value
      try {
        const data = await api('login', { method: 'POST', body: { password }, auth: false })
        setToken(data.token)
        showDash()
        await load()
      } catch (e) {
        loginErr.textContent = e.message || 'Login failed'
        loginErr.classList.remove('hidden')
      }
    })

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click()
    })

    document.getElementById('logoutBtn').addEventListener('click', () => {
      setToken('')
      showLogin()
    })

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      try { await load() } catch (e) {
        if (e.status === 401) { setToken(''); showLogin() }
        dashErr.textContent = e.message || 'Refresh failed'
        dashErr.classList.remove('hidden')
      }
    })

    ;(async () => {
      if (!token()) return showLogin()
      try {
        showDash()
        await load()
      } catch {
        setToken('')
        showLogin()
      }
    })()
  </script>
</body>
</html>
