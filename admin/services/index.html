<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Oracy — Services</title>
  <link rel="icon" href="/app-logo.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="admin wide">
    <section id="loginView" class="login-box">
      <div class="brand-lock">
        <img src="/app-logo.jpg" alt="" width="40" height="40" />
        <strong style="font-family:Fraunces,Georgia,serif;font-size:1.35rem;">Oracy Admin</strong>
      </div>
      <h1>Services</h1>
      <p class="sub">Sign in to probe backend health.</p>
      <label class="field" for="password">Admin password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="primary" id="loginBtn" type="button" style="width:100%">Sign in</button>
      <p class="err hidden" id="loginErr"></p>
    </section>

    <section id="dashView" class="hidden">
      <nav class="admin-nav" aria-label="Admin">
        <a href="/admin">Remote config</a>
        <a href="/admin/invites">Invites</a>
        <a href="/admin/services" aria-current="page">Services</a>
      </nav>

      <div class="toolbar">
        <div>
          <h1>Services</h1>
          <p class="sub" style="margin:0">Live checks for backends the app depends on</p>
        </div>
        <div style="display:flex;gap:1rem;align-items:center;">
          <button class="primary" id="runBtn" type="button">Run checks</button>
          <button class="ghost" id="logoutBtn" type="button">Log out</button>
        </div>
      </div>

      <p class="err hidden" id="dashErr"></p>

      <div class="status-summary card" id="summary">
        <div class="status-summary-title" id="summaryTitle">Not run yet</div>
        <p class="sub" id="summarySub" style="margin-bottom:0.85rem">Probes Supabase, OpenAI tokens, Firebase, edge functions, and email.</p>
        <div class="status-pills">
          <div class="status-pill"><strong id="okCount">—</strong><span>OK</span></div>
          <div class="status-pill fail"><strong id="failCount">—</strong><span>Fail</span></div>
          <div class="status-pill skip"><strong id="skipCount">—</strong><span>Skip</span></div>
        </div>
        <p class="muted" id="costLine" style="margin:0.75rem 0 0;font-size:0.85rem;"></p>
      </div>

      <div id="groups"></div>
    </section>
  </main>

  <script>
    const TOKEN_KEY = 'oracy.admin.token'
    const CATEGORY_ORDER = ['Supabase', 'Database', 'Storage', 'Edge', 'OpenAI', 'Firebase', 'Email']

    const loginView = document.getElementById('loginView')
    const dashView = document.getElementById('dashView')
    const dashErr = document.getElementById('dashErr')
    const groupsEl = document.getElementById('groups')
    const runBtn = document.getElementById('runBtn')

    function token() { return sessionStorage.getItem(TOKEN_KEY) || '' }
    function setToken(t) {
      if (t) sessionStorage.setItem(TOKEN_KEY, t)
      else sessionStorage.removeItem(TOKEN_KEY)
    }

    function showLogin() {
      loginView.classList.remove('hidden')
      dashView.classList.add('hidden')
    }
    function showDash() {
      loginView.classList.add('hidden')
      dashView.classList.remove('hidden')
    }

    async function api(action, { method = 'GET', body, auth = true } = {}) {
      const headers = { 'Content-Type': 'application/json' }
      if (auth) headers.Authorization = `Bearer ${token()}`
      const res = await fetch(`/api/services?action=${encodeURIComponent(action)}`, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok) {
        const err = new Error(data.error || res.statusText)
        err.status = res.status
        throw err
      }
      return data
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
    }

    function mark(status) {
      if (status === 'ok') return '<span class="tick" title="OK" aria-label="OK">✓</span>'
      if (status === 'fail') return '<span class="cross" title="Fail" aria-label="Fail">✗</span>'
      if (status === 'skip') return '<span class="dash" title="Skip" aria-label="Skip">–</span>'
      return '<span class="dash">…</span>'
    }

    function render(report) {
      const summary = report.summary || { ok: 0, fail: 0, skip: 0 }
      document.getElementById('okCount').textContent = summary.ok
      document.getElementById('failCount').textContent = summary.fail
      document.getElementById('skipCount').textContent = summary.skip

      const title = document.getElementById('summaryTitle')
      if (summary.fail === 0) {
        title.textContent = 'All clear'
        title.style.color = '#2f6b45'
      } else {
        title.textContent = 'Needs attention'
        title.style.color = '#a33'
      }

      const when = report.checkedAt
        ? new Date(report.checkedAt).toLocaleString()
        : ''
      document.getElementById('summarySub').textContent = when
        ? `Last run ${when}`
        : 'Backend probes complete.'

      const cost = Number(report.estimatedCostUsd || 0)
      document.getElementById('costLine').textContent = cost > 0
        ? `Probe cost ≈ $${cost.toFixed(5)} (tiny OpenAI completion)`
        : 'Probe cost ≈ $0 (models list is free; token probe skipped or free)'

      const byCat = {}
      for (const c of report.checks || []) {
        ;(byCat[c.category] ||= []).push(c)
      }

      groupsEl.innerHTML = ''
      const order = [
        ...CATEGORY_ORDER.filter((k) => byCat[k]),
        ...Object.keys(byCat).filter((k) => !CATEGORY_ORDER.includes(k))
      ]

      for (const cat of order) {
        const items = byCat[cat] || []
        const section = document.createElement('section')
        section.className = 'status-group'
        section.innerHTML = `<h2>${escapeHtml(cat)}</h2>`
        const list = document.createElement('div')
        list.className = 'status-list'
        for (const item of items) {
          const row = document.createElement('div')
          row.className = `status-row ${item.status}`
          const costBit =
            typeof item.costUsd === 'number' && item.costUsd > 0
              ? `<span class="cost">~$${item.costUsd.toFixed(5)}</span>`
              : ''
          row.innerHTML = `
            <div class="mark">${mark(item.status)}</div>
            <div class="body">
              <div class="name">${escapeHtml(item.name)}</div>
              <div class="detail">${escapeHtml(item.detail || '')}${costBit}</div>
            </div>`
          list.appendChild(row)
        }
        section.appendChild(list)
        groupsEl.appendChild(section)
      }
    }

    async function runChecks() {
      dashErr.classList.add('hidden')
      runBtn.disabled = true
      runBtn.textContent = 'Checking…'
      document.getElementById('summaryTitle').textContent = 'Checking…'
      document.getElementById('summaryTitle').style.color = ''
      try {
        const report = await api('run', { method: 'POST' })
        render(report)
      } catch (e) {
        if (e.status === 401) {
          setToken('')
          showLogin()
          return
        }
        dashErr.textContent = e.message || 'Checks failed'
        dashErr.classList.remove('hidden')
      } finally {
        runBtn.disabled = false
        runBtn.textContent = 'Run checks'
      }
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      document.getElementById('loginErr').classList.add('hidden')
      try {
        const data = await api('login', {
          method: 'POST',
          body: { password: document.getElementById('password').value },
          auth: false
        })
        setToken(data.token)
        showDash()
        await runChecks()
      } catch (e) {
        const el = document.getElementById('loginErr')
        el.textContent = e.message || 'Login failed'
        el.classList.remove('hidden')
      }
    })

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click()
    })

    document.getElementById('logoutBtn').addEventListener('click', () => {
      setToken('')
      showLogin()
    })

    runBtn.addEventListener('click', () => runChecks())

    ;(async () => {
      if (!token()) return showLogin()
      try {
        showDash()
        await runChecks()
      } catch {
        setToken('')
        showLogin()
      }
    })()
  </script>
</body>
</html>
